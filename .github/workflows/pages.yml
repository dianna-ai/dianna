name: GitHub Pages

# The site at https://dianna-ai.github.io/dianna/: the Sphinx documentation (the same build as Read the Docs, see
# .readthedocs.yaml), plus the browser dashboard (web/) at dashboard/
on:
  push:
    branches: [main, standalone_web]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-python-and-package
        with:
          python-version: '3.12'
          extras-require: docs

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build documentation
        run: make html
        working-directory: docs

      - name: Build browser dashboard
        run: python web/build.py

      - name: Add the dashboard to the site
        run: cp -r web/_site docs/_build/html/dashboard

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
