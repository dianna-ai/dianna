name: notebooks

on:
  workflow_dispatch:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  run_notebooks:
    name: Run notebooks on (${{ matrix.python-version }}, ${{ matrix.os }})
    if: github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS notebooks only run on main/manual runs; unit tests in build.yml cover macOS on PRs
        os: ${{ github.event_name == 'pull_request' && fromJson('["ubuntu-latest", "windows-latest"]') || fromJson('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-python-and-package
        with:
          python-version: ${{ matrix.python-version }}
          extras-require: dev,notebooks
      # Workaround for xgboost OpenMP issue on macOS (see https://github.com/dmlc/xgboost/pull/12108).
      # Once that PR is included in a released version of xgboost, this step can be removed.
      - name: Install OpenMP runtime (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Run tutorial notebooks
        # Workaround for OpenMP/threading deadlock issues in buggy xgboost + torch setups.
        # Limiting threads prevents the deadlock that causes hangs during LIME inference.
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          TOKENIZERS_PARALLELISM: "false"
        shell: bash
        # One collapsible log group per notebook (Actions can't generate steps dynamically), plus a summary table
        run: |
          echo "| Notebook | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for nb in $(find tutorials -name '*.ipynb' | sort); do
            # fails on Windows due to timeouts, not sure why, see #877
            if [[ "$RUNNER_OS" == Windows && "$nb" == *kernelshap_tabular_land_atmosphere* ]]; then
              echo "| $nb | skipped |" >> "$GITHUB_STEP_SUMMARY"; continue
            fi
            echo "::group::$nb"
            if pytest --nbmake --nbmake-timeout=3600 "$nb"; then result=passed; else result=failed; failed=1; fi
            echo "::endgroup::"
            [[ $result == failed ]] && echo "::error title=Notebook failed::$nb"
            echo "| $nb | $result |" >> "$GITHUB_STEP_SUMMARY"
          done
          exit $failed
